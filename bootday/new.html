/* THE DAY (the owner: "can you add a nice daylight cycle into loading screen?"): the window's day goes round in 16 s, from late morning: the sun
   goes down behind the hills, dusk, night with its stars, the moon and fireflies, dawn, day. Each light is a layer over the day's picture
   (the sky's own bands recoloured to daylight.js' dusk, night and dawn; the land, the clouds, the cat and the sun multiplied by the dusk's warm and the
   night's blue, each through its own picture as a mask), and only its opacity moves, in 4 steps: so the colours change in a few flat bands, never
   smoothly, by the compositor alone like the rest. The sun and the moon go round by whole art px. Asked for less motion: a still dusk. */
